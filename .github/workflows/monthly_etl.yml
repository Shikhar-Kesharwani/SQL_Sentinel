name: Monthly Development ETL

on:
  schedule:
    - cron: '0 0 1 * *' # Runs at midnight on the first day of every month
  workflow_dispatch: # Allows manual trigger

jobs:
  extract_and_merge:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas geopy requests

    - name: Run OSM Extractor (Layer 1 & 2)
      run: python src/pipeline/extractors/osm_extractor.py

    - name: Run Indicator Generator (Layer 3 & 4)
      run: python src/pipeline/transformers/indicator_generator.py

    - name: Run Dataset Merger (Layer 5)
      run: python src/pipeline/merger.py

    - name: Commit and push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add data/
        git commit -m "Automated Monthly Development Index Update" || echo "No changes to commit"
        git push
